# MiPlay Bridge（妙播桥）- Docker Compose 部署配置
#
# 重要提示（两个必需项）：
#
#  1. devices 必须挂载宿主机的物理声卡设备 "/dev/snd:/dev/snd"！
#     本插件通过 ALSA / MPD / ffmpeg+aplay 直接与硬件声卡（3.5mm 耳机孔、
#     主板音频口或 USB DAC）进行底层通信。宿主机没有物理音频设备时容器会
#     报错并以退出码 3 退出。
#
#  2. 必须使用 network_mode: host！
#     小米妙播通过 mDNS(5353/udp) 被手机发现，DLNA 通过 SSDP(1900/udp)
#     广播被发现，组播流量无法穿透 Docker 默认桥接网络。host 网络模式下
#     无需 ports 映射：HTTP 控制台/API 直接监听宿主机端口（默认 8092），
#     妙播控制口监听 8899/tcp。
#
# 声卡选择：宿主机执行 `cat /proc/asound/cards` 查看编号，通过 ALSA_CARD 指定。

services:
  miplay-bridge:
    # 优先使用 GHCR 预构建镜像（`docker compose pull` 更新到最新正式版）；
    # 镜像不可用（尚未发布 / 离线）时自动回退为本地构建。
    # 生产环境建议固定精确版本，例如 ghcr.io/para-ecoli/miplay-bridge:0.1.0
    image: ghcr.io/para-ecoli/miplay-bridge:latest
    build:
      context: .            # 构建上下文为项目根目录（Dockerfile 所在处）
      dockerfile: Dockerfile
    container_name: miplay-bridge
    # 异常退出或宿主机重启后自动拉起，兼顾自愈与开机自启。
    restart: unless-stopped
    # 见顶部说明：mDNS/SSDP 组播发现要求 host 网络，禁用默认桥接网络。
    network_mode: host
    # 挂载物理声卡设备节点，容器内经 ALSA 直接访问硬件音频输出。
    devices:
      - "/dev/snd:/dev/snd"
    # 持久化设备标识（dlna-udn、miplay-device-id）等到 ./data，避免重启后身份变化。
    volumes:
      - "./data:/data:rw"
    environment:
      # HTTP 控制台/API 监听端口（host 网络下直接占用宿主机端口）。
      BRIDGE_PORT: "8092"
      # 声卡编号与 PCM 设备号：宿主执行 `cat /proc/asound/cards` 确认后填写。
      ALSA_CARD: "0"
      ALSA_PCM_DEVICE: "0"
      # MPD 用于音量控制的 ALSA 混音器名称（如 Master / Headphone）。
      MPD_MIXER_CONTROL: "Master"
      # 小米妙播功能开关及在手机端显示的设备名。
      MIPLAY_ENABLED: "true"
      MIPLAY_NAME: "妙播桥"
      # DLNA/UPnP 渲染器功能开关及在 DLNA 控制点显示的名称。
      DLNA_ENABLED: "true"
      DLNA_FRIENDLY_NAME: "妙播桥"
      # 日志级别（info/debug/warn/error）与时区。
      BRIDGE_LOG_LEVEL: "info"
      TZ: "Asia/Shanghai"
    # 内存上限，防止解码/缓冲异常时占用过多宿主机内存。
    mem_limit: 256m
    # 周期调用内置 healthcheck 子命令探测服务健康状态。
    healthcheck:
      test: ["CMD", "/usr/local/bin/miplay-bridge", "healthcheck"]
      interval: 30s       # 探测间隔
      timeout: 5s         # 单次探测超时
      retries: 3          # 连续失败次数达到该值判定为不健康
      start_period: 20s   # 启动初期宽限期，期间失败不计入 retries
