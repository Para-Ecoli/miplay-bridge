# MiPlay Bridge（妙播桥）· 持续集成
#
# PR 与 main 分支推送时执行：格式检查（gofmt）、静态检查（go vet）与单元测试。
# 发布流水线（release.yml）复用同样的测试门禁——CI 不过，发布不过。

name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查（gofmt）
        run: test -z "$(gofmt -l .)"

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 单元测试
        run: go test ./...
