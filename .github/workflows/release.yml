# MiPlay Bridge（妙播桥）· 版本发布
#
# 推送 v*.*.* tag 时触发（例：git tag v0.2.0 && git push origin v0.2.0）：
#   1. 测试门禁（不通过不发布）；
#   2. 构建 linux/amd64 + linux/arm64 多架构镜像（arm64 经 QEMU 模拟）；
#   3. 推送至 ghcr.io/para-ecoli/miplay-bridge，并把 git tag 版本注入二进制与 OCI 标签；
#   4. 创建 GitHub Release，自动生成变更说明。
#
# 首次推送后：到 GitHub Packages 页面把该包可见性改为 public（否则匿名拉取会 401）。

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write    # 创建 GitHub Release
  packages: write    # 推送 ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— `gh release create --generate-notes` 需要完整的 tag 历史来生成变更说明
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 测试门禁（不通过不发布）
        run: go test ./...

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.2.0 -> 0.2.0 / 0.2 / 0 / sha-xxxxx；预发布（如 v0.2.0-rc.1）不会更新 latest
      - name: 生成镜像标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}      # 自动转小写（Para-Ecoli -> para-ecoli）
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: 构建并推送（linux/amd64 + linux/arm64）
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
